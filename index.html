<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portal pengaduan dan bantuan hukum mahasiswa ADVOKITA">
    <title>Masuk — ADVOKITA</title>
    <link rel="icon" href="/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/css/styles.css" rel="stylesheet">
  </head>
  <body class="auth-page">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
      <section class="auth-card card border-0 overflow-hidden">
        <div class="brand-panel text-center text-white">
          <span class="brand-emblem"><i class="bi bi-balance-scale"></i></span>
          <h1 class="brand-title mb-1">ADVOKITA</h1>
          <p class="brand-subtitle mb-0">Whistleblowing &amp; Legal Aid System</p>
        </div>

        <ul class="nav nav-pills nav-fill auth-tabs p-1" id="authTab" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#login" type="button">Masuk</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#register" type="button">Registrasi</button></li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane fade show active" id="login">
            <form class="auth-form" action="/dashboard.html">
              <div class="mb-4"><h2>Masuk ke ADVOKITA</h2><p class="text-secondary mb-0">Gunakan akun mahasiswa Anda.</p></div>
              <div class="mb-3">
                <label class="form-label">NIM / Username <span class="text-danger">*</span></label>
                <input class="form-control" required inputmode="numeric" pattern="[0-9]+" placeholder="Masukkan NIM Anda">
              </div>
              <div class="mb-3">
                <label class="form-label">Kata sandi <span class="text-danger">*</span></label>
                <div class="input-group">
                  <input class="form-control" type="password" id="loginPassword" minlength="6" required placeholder="Minimal 6 karakter">
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('loginPassword',this)" tabindex="-1"><i class="bi bi-eye"></i></button>
                </div>
              </div>
              <div class="mb-4 text-end">
                <a href="#" class="text-danger text-decoration-none" style="font-size:11px">Lupa kata sandi?</a>
              </div>
              <button class="btn btn-danger w-100" type="submit">Masuk</button>
            </form>
          </div>
          <div class="tab-pane fade" id="register">
            <form class="auth-form" action="/dashboard.html">
              <div class="mb-4"><h2>Buat Akun Baru</h2><p class="text-secondary mb-0">Daftar untuk mengajukan laporan.</p></div>
              <div class="mb-3">
                <label class="form-label">Nama lengkap <span class="text-danger">*</span></label>
                <input class="form-control" required placeholder="Nama sesuai data kampus">
              </div>
              <div class="mb-3">
                <label class="form-label">NIM <span class="text-danger">*</span></label>
                <input class="form-control" required inputmode="numeric" pattern="[0-9]+" placeholder="Masukkan NIM (angka saja)">
              </div>
              <div class="mb-3">
                <label class="form-label">Kata sandi <span class="text-danger">*</span></label>
                <div class="input-group">
                  <input class="form-control" type="password" id="regPassword" minlength="6" required placeholder="Minimal 6 karakter">
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('regPassword',this)" tabindex="-1"><i class="bi bi-eye"></i></button>
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label">Konfirmasi kata sandi <span class="text-danger">*</span></label>
                <div class="input-group">
                  <input class="form-control" type="password" id="regPasswordConfirm" minlength="6" required placeholder="Ulangi kata sandi">
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('regPasswordConfirm',this)" tabindex="-1"><i class="bi bi-eye"></i></button>
                </div>
              </div>
              <button class="btn btn-danger w-100" type="submit">Registrasi</button>
            </form>
          </div>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function togglePassword(id, btn) {
        const input = document.getElementById(id);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'bi bi-eye-slash';
        } else {
          input.type = 'password';
          icon.className = 'bi bi-eye';
        }
      }
    </script>
  </body>
</html>
